<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Cosmic Synapse Theory 12D</title>
  <desc id="desc">A dark scientific visualization of a twelve-channel synaptic field surrounding a luminous CST core.</desc>
