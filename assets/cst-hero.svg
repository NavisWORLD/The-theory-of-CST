    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.12" stop-color="#8ff4ff"/><stop offset="0.38" stop-color="#6e86ff" stop-opacity="0.8"/><stop offset="0.72" stop-color="#a855f7" stop-opacity="0.18"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
